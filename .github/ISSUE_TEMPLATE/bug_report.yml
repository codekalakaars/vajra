name: Bug Report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Vajra are you running?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS and architecture are you on?
      placeholder: e.g., macOS 15 (arm64), Ubuntu 24.04 (x64), Windows 11 (x64)
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node and Rust versions
      description: Output of `node --version` and `rustc --version`.
      placeholder: e.g., v22.11.0 / rustc 1.83.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project?
      options:
        - Native core (file / process / env / path)
        - Build or packaging (napi, loader, typings)
        - Legacy CLI (legacy/ — reference only, not maintained)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. `pnpm install && pnpm build`
        2. `node -e "require('./').listFiles('.', true)"`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste any relevant logs or error output.
      render: shell
