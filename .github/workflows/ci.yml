name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The whole point of the native core is that it works on all three
    # platforms, and only a matrix can demonstrate that. Testing on Linux
    # alone would leave the Windows PATHEXT lookup and the macOS build
    # entirely unexercised.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the addon and runs the Node smoke suite against it. This is what
      # catches problems that only exist at the JS boundary: a struct exported
      # as a class, or a loader that cannot find the platform binary.
      - name: Build native addon
        run: pnpm run build

      - name: Node smoke tests
        run: pnpm test
