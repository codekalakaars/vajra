name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/native/Cargo.lock') }}

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path packages/native/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path packages/native/Cargo.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm run build

      # Everything above this line is the Rust/napi gate; the TypeScript
      # packages have their own suites.
      #
      # build:all must precede test:all: turbo does not make a package's own
      # `build` a prerequisite of its own `test`, and every test in this repo
      # imports dist/ rather than src/, so a stale dist/ is a false green.
      - name: Build TypeScript packages
        run: pnpm build:all

      - name: TypeScript tests
        run: pnpm test:all
