name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock') }}

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path packages/core/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path packages/core/Cargo.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm run build

      - name: Node smoke tests
        run: pnpm test
