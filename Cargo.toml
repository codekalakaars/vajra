[package]
name = "vajra-native"
version = "0.1.0"
edition = "2021"
description = "Cross-platform native operations for Vajra"
authors = ["Vajra Contributors"]
license = "Apache-2.0"
repository = "https://github.com/codekalakaars/vajra"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

# legacy/ is the previous CLI, kept for reference only. Excluding it keeps
# cargo from trying to build it as part of this crate's directory tree.
[workspace]
members = []
exclude = ["legacy"]

[dependencies]
napi = { version = "2", features = ["async"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"
