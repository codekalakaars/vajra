[package]
name = "vajra-native"
version = "0.1.0"
edition = "2021"
description = "Cross-platform native operations for Vajra"
authors = ["Vajra Contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"
