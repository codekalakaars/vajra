<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vajra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
    <h1 class="app-title">Vajra</h1>
    <div class="connection-status" id="connection-status">
      <span class="status-dot"></span>
      <span class="status-text">Disconnected</span>
    </div>
  </header>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="sidebar-new" class="btn btn-primary sidebar-new">+ New Chat</button>
      </div>
      <div id="sidebar-list" class="sidebar-list"></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <main class="app-main" id="app-root">
      <div class="loading">Connecting...</div>
    </main>
  </div>
  <script type="module" src="index.js"></script>
</body>
</html>
