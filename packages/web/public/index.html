<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vajra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gray: {
              950: '#0a0a0f',
            }
          }
        }
      }
    }
  </script>
  <style>
    .scroll-hidden::-webkit-scrollbar { display: none; }
    .scroll-hidden { scrollbar-width: none; }
    .prose pre { background: #1e1e2e; border-radius: 0.5rem; }
    .prose code { color: #cdd6f4; }
    .prose p { margin-bottom: 0.5rem; }
    .prose h1, .prose h2, .prose h3 { color: #fff; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .prose th, .prose td { padding: 0.5rem 0.75rem; border: 1px solid #374151; text-align: left; }
    .prose th { background: #1f2937; font-weight: 600; color: #f3f4f6; }
    .prose td { color: #d1d5db; }
    .prose tr:nth-child(even) { background: #111827; }
    .prose blockquote { border-left: 3px solid #4b5563; padding-left: 1rem; color: #9ca3af; margin: 1rem 0; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose li { margin: 0.25rem 0; }
    .prose strong { color: #f3f4f6; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">
  <div id="app-root" class="h-screen"></div>
  <script type="module" src="index.js"></script>
</body>
</html>
