[package]
name = "vajra-core"
version = "0.0.1"
edition = "2021"
description = "Cross-platform native operations for Vajra"
authors = ["Vajra Contributors"]
license = "Apache-2.0"
repository = "https://github.com/codekalakaars/vajra"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[workspace]
members = []

[dependencies]
napi = { version = "2", features = ["async"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
opt-level = "s"
strip = "symbols"
