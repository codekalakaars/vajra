[package]
name = "vajra"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["sched", "mount", "user", "process", "signal"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
