packages:
  - "."
  - "packages/*"
  - "experimental-packages/*"

# Which dependencies may run install scripts. The three below are transitive
# deps of hyperframes that have never been built here; pnpm 11 refuses to
# install until each one is answered explicitly rather than left unresolved.
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
onlyBuiltDependencies:
  - esbuild
